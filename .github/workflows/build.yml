name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/opencomputers-integration-spec

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out AdvancedRocketry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: AdvancedRocketry-Continuation

      - name: Check out LibVulpes
        uses: actions/checkout@v4
        with:
          repository: zerozaki666/libVulpes-Continuation
          ref: unstable1_7
          fetch-depth: 0
          path: libVulpes-Continuation

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build and test
        working-directory: AdvancedRocketry-Continuation
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedRocketry-Continuation
          if-no-files-found: error
          path: |
            AdvancedRocketry-Continuation/build/libs/*.jar
            AdvancedRocketry-Continuation/output/*.jar
