rootProject.name = 'AdvancedRocketry-Continuation'

include 'libVulpes'
def continuationLib =
        new File(settingsDir, '../libVulpes-Continuation').canonicalFile
def legacyLib = new File(settingsDir, '../libVulpes').canonicalFile
if (!continuationLib.isDirectory() && !legacyLib.isDirectory()) {
    throw new GradleException(
            'Expected ../libVulpes-Continuation or ../libVulpes')
}
project(':libVulpes').projectDir =
        continuationLib.isDirectory() ? continuationLib : legacyLib
