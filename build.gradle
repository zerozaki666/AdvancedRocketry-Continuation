buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1'
    }
}

apply plugin: 'forge'
apply from: 'gradle/scripts/getbuildnumber.gradle'

group = 'zmaster587.advancedRocketry'
archivesBaseName = archivebase
sourceCompatibility = 8
targetCompatibility = 8

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'eclipse/assets'
    replaceIn 'src/main/java/zmaster587/advancedRocketry/AdvancedRocketry.java'
    replace '@MAJOR@', version_major
    replace '@MINOR@', version_minor
    replace '@REVIS@', version_revis
    replace '@QUALIFIER@', version_qualifier
    replace '@BUILD@', project.getBuildNumber()
    replace '%LIBVULPESVERSION%', project.libVulpesVersion
}

apply from: 'gradle/scripts/version.gradle'

jar {
    manifest {
        attributes 'FMLCorePlugin': 'zmaster587.advancedRocketry.asm.AdvancedRocketryPlugin'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'industrialcraft-2'
                url = uri('https://maven.ic2.player.to/')

                // IC2 publishes artifacts without Maven POM metadata.
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeGroup('net.industrial-craft')
        }
    }
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'chickenbones'
        url = 'https://chickenbones.net/maven/'
    }
    maven {
        name = 'gt'
        url = 'https://gregtech.overminddl1.com/'
    }
    maven {
        name = 'gtnh-releases'
        url = uri('https://nexus.gtnewhorizons.com/repository/releases/')
    }
}

dependencies {
    implementation project(':libVulpes')
    testImplementation 'junit:junit:4.13.2'
    compileOnly('com.github.GTNewHorizons:OpenComputers:1.12.44-GTNH:api') {
        transitive = false
    }
    testCompileOnly('com.github.GTNewHorizons:OpenComputers:1.12.44-GTNH:api') {
        transitive = false
    }
    testRuntimeOnly('com.github.GTNewHorizons:OpenComputers:1.12.44-GTNH:api') {
        transitive = false
    }
    compileOnly('com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-966-GTNH:api') {
        transitive = false
    }
    testCompileOnly('com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-966-GTNH:api') {
        transitive = false
    }
    testRuntimeOnly('com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-966-GTNH:api') {
        transitive = false
    }
    def localMicdoodleCore = fileTree(
            dir: 'libs',
            include: ['MicdoodleCore*.jar'])
    def localGalacticraftCore = fileTree(
            dir: 'libs',
            include: ['GalacticraftCore*.jar'])
    if (localMicdoodleCore.isEmpty() || localGalacticraftCore.isEmpty()) {
        implementation 'micdoodle8.mods:MicdoodleCore:1.7-3.0.12.504:Dev'
        implementation 'micdoodle8.mods:GalacticraftCore:1.7-3.0.12.504:Dev'
    }
    else {
        implementation localMicdoodleCore
        implementation localGalacticraftCore
    }
    implementation 'codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev'
    implementation 'codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev'
    implementation 'codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev'
    implementation group: 'com.gregoriust.gregtech',
            name: 'gregtech_1.7.10',
            version: '6.07.12',
            classifier: 'dev'
}

def advRocketSuiteRevision = 2
def advRocketManifestVersion =
        "${version_major}.${version_minor}.${version_revis}${version_qualifier}" +
        project.getBuildNumber() + "+suite.${advRocketSuiteRevision}"
def advRocketAppFiles = [
        'station_control.lua',
        'biome_scanner.lua',
        'rocket_monitor.lua',
        'warp_controller.lua',
        'atmosphere_detector.lua',
        'planet_selector.lua',
        'laser_drill.lua'
]
def advRocketDiskRoot = 'assets/advancedrocketry/loot/advrocket/'
def advRocketRequiredDirectories = [
        advRocketDiskRoot,
        advRocketDiskRoot + 'usr/',
        advRocketDiskRoot + 'usr/bin/',
        advRocketDiskRoot + 'usr/lib/',
        advRocketDiskRoot + 'usr/lib/advrocket/',
        advRocketDiskRoot + 'usr/lib/advrocket/apps/'
]

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    inputs.property 'advRocketManifestVersion', advRocketManifestVersion
    inputs.files fileTree('oc_examples') {
        include(['advrocket.lua', 'update.lua'] + advRocketAppFiles)
    }

    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: project.minecraft.version
    }

    filesMatching(
            'assets/advancedrocketry/loot/advrocket/usr/lib/advrocket/manifest.lua') {
        expand mod_version: advRocketManifestVersion
    }

    from('oc_examples') {
        include 'advrocket.lua', 'update.lua'
        into 'assets/advancedrocketry/loot/advrocket/usr/bin'
    }

    from('oc_examples') {
        include advRocketAppFiles
        into 'assets/advancedrocketry/loot/advrocket/usr/lib/advrocket/apps'
    }
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    archiveClassifier.set('deobf')
    destinationDirectory.set(file('output'))
    manifest {
        attributes 'FMLCorePlugin': 'zmaster587.advancedRocketry.asm.AdvancedRocketryPlugin'
        attributes 'FMLCorePluginContainsFMLMod': 'true'
    }
    mustRunAfter 'jar'
}

tasks.build.dependsOn deobfJar

/*
 * ForgeGradle 1.2's reobfuscator rewrites the universal JAR and drops ZIP
 * directory entries. OpenComputers 1.12.44 resolves FileSystem.fromClass()
 * roots with ZipFile.getEntry(), then builds its directory tree exclusively
 * from explicit directory entries. Restore those entries after reobf so the
 * AdvRocket program disk can actually be mounted in-game.
 */
def restoreAdvRocketDirectoryEntries = { File archive ->
    if (!archive.isFile())
        throw new GradleException(
                "Expected archive was not created: ${archive}")

    def presentDirectories = [] as Set
    def scan = new java.util.zip.ZipFile(archive)
    try {
        def entries = scan.entries()
        while (entries.hasMoreElements()) {
            def entry = entries.nextElement()
            if (entry.directory)
                presentDirectories.add(entry.name)
        }
    }
    finally {
        scan.close()
    }

    def missingDirectories = advRocketRequiredDirectories.findAll {
        !presentDirectories.contains(it)
    }
    if (missingDirectories.isEmpty())
        return

    def temporaryArchive = new File(archive.parentFile,
            archive.name + '.advrocket-directory-fix.tmp')
    java.nio.file.Files.deleteIfExists(temporaryArchive.toPath())
    def replacementReady = false
    try {
        def source = new java.util.zip.ZipFile(archive)
        try {
            def output = new java.util.zip.ZipOutputStream(
                    new BufferedOutputStream(
                            new FileOutputStream(temporaryArchive)))
            try {
                if (source.comment != null)
                    output.setComment(source.comment)

                def copiedNames = [] as Set
                def entries = source.entries()
                byte[] buffer = new byte[8192]
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (!copiedNames.add(entry.name))
                        throw new GradleException(
                                "${archive.name} contains duplicate ZIP entry " +
                                        entry.name)

                    def copy = new java.util.zip.ZipEntry(entry.name)
                    if (entry.time >= 0L)
                        copy.setTime(entry.time)
                    if (entry.comment != null)
                        copy.setComment(entry.comment)
                    if (entry.method == java.util.zip.ZipEntry.STORED) {
                        copy.setMethod(java.util.zip.ZipEntry.STORED)
                        copy.setSize(entry.size)
                        copy.setCompressedSize(entry.compressedSize)
                        copy.setCrc(entry.crc)
                    }
                    else {
                        copy.setMethod(java.util.zip.ZipEntry.DEFLATED)
                    }

                    output.putNextEntry(copy)
                    if (!entry.directory) {
                        def input = source.getInputStream(entry)
                        try {
                            int count
                            while ((count = input.read(buffer)) != -1)
                                output.write(buffer, 0, count)
                        }
                        finally {
                            input.close()
                        }
                    }
                    output.closeEntry()
                }

                missingDirectories.each { directory ->
                    def entry = new java.util.zip.ZipEntry(directory)
                    entry.setMethod(java.util.zip.ZipEntry.STORED)
                    entry.setSize(0L)
                    entry.setCompressedSize(0L)
                    entry.setCrc(0L)
                    output.putNextEntry(entry)
                    output.closeEntry()
                }
            }
            finally {
                output.close()
            }
        }
        finally {
            source.close()
        }

        try {
            java.nio.file.Files.move(temporaryArchive.toPath(),
                    archive.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                    java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        }
        catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
            java.nio.file.Files.move(temporaryArchive.toPath(),
                    archive.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        replacementReady = true
    }
    finally {
        if (!replacementReady)
            java.nio.file.Files.deleteIfExists(temporaryArchive.toPath())
    }
}

task ensureAdvRocketPackageDirectories {
    dependsOn 'reobf', deobfJar
    doLast {
        [tasks.jar.archiveFile.get().asFile,
                tasks.deobfJar.archiveFile.get().asFile].each {
            restoreAdvRocketDirectoryEntries(it)
        }
    }
}

task verifyAdvRocketPackage {
    dependsOn ensureAdvRocketPackageDirectories
    doLast {
        def requiredEntries = [
                advRocketDiskRoot + '.prop',
                advRocketDiskRoot + 'usr/bin/advrocket.lua',
                advRocketDiskRoot + 'usr/bin/update.lua',
                advRocketDiskRoot + 'usr/lib/advrocket/manifest.lua',
                'zmaster587/advancedRocketry/tile/airtight/TileAirtightEnergyInterface.class',
                'zmaster587/advancedRocketry/tile/airtight/TileAirtightFluidInterface.class',
                'zmaster587/advancedRocketry/integration/opencomputers/TileAirtightOpenComputersCable.class',
                'zmaster587/advancedRocketry/integration/appliedenergistics/TileAirtightMESmartInterface.class',
                'zmaster587/advancedRocketry/integration/appliedenergistics/TileAirtightMEDenseInterface.class'
        ] + advRocketAppFiles.collect {
            advRocketDiskRoot + 'usr/lib/advrocket/apps/' + it
        }
        [tasks.jar.archiveFile.get().asFile,
                tasks.deobfJar.archiveFile.get().asFile].each { archive ->
            if (!archive.isFile())
                throw new GradleException(
                        "Expected archive was not created: ${archive}")
            def zip = new java.util.zip.ZipFile(archive)
            try {
                def fileEntries = [] as Set
                def directoryEntries = [] as Set
                def entries = zip.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (entry.directory)
                        directoryEntries.add(entry.name)
                    else
                        fileEntries.add(entry.name)
                }
                advRocketRequiredDirectories.each { entry ->
                    if (!directoryEntries.contains(entry))
                        throw new GradleException(
                                "${archive.name} is missing ZIP directory ${entry}")
                }
                requiredEntries.each { entry ->
                    if (!fileEntries.contains(entry))
                        throw new GradleException(
                                "${archive.name} is missing ${entry}")
                }
                def manifestPath = advRocketDiskRoot +
                        'usr/lib/advrocket/manifest.lua'
                def manifestInput = zip.getInputStream(zip.getEntry(
                        manifestPath))
                def manifestText
                try {
                    manifestText = manifestInput.getText('UTF-8')
                }
                finally {
                    manifestInput.close()
                }
                if (!manifestText.contains(
                        "modVersion = \"${advRocketManifestVersion}\""))
                    throw new GradleException(
                            "${archive.name} has the wrong AdvRocket suite revision")
                def unexpected = fileEntries.findAll {
                    it.startsWith(advRocketDiskRoot) &&
                            !requiredEntries.contains(it)
                }
                if (!unexpected.isEmpty())
                    throw new GradleException(
                            "${archive.name} contains unexpected AdvRocket disk resources: ${unexpected}")
                def bundledApi = fileEntries.find {
                    it.startsWith('li/cil/oc/api/')
                }
                if (bundledApi != null)
                    throw new GradleException(
                            "${archive.name} bundles OpenComputers API class ${bundledApi}")
                def bundledAeApi = fileEntries.find {
                    it.startsWith('appeng/api/')
                }
                if (bundledAeApi != null)
                    throw new GradleException(
                            "${archive.name} bundles AE2 API class ${bundledAeApi}")
            }
            finally {
                zip.close()
            }
        }
    }
}

tasks.build.dependsOn verifyAdvRocketPackage
